      </label>

      <select id="pushEmployeeName">

        </option>
      </select>

    </div>

    <div

      style="display:none"

      <label

        'kensington-work-orders.firebaseapp.com',

    let firebaseMessaging =

      null;

    // --------------------------------------------------------
    // NOTIFICATION DIAGNOSTICS
    // --------------------------------------------------------

    function addNotificationDiagnostic(
      stage,
      detail
    ) {
      const now =
        new Date();

      const time =
        now.toLocaleTimeString(
          'en-AU',
          {
            hour12:
              false
          }
        ) +
        '.' +
        String(
          now.getMilliseconds()
        ).padStart(
          3,
          '0'
        );

      const text =
        '[' +
        time +
        '] ' +
        stage +
        (
          detail
            ? ' - ' + detail
            : ''
        );

      notificationDiagnosticsLog.push(
        text
      );

      console.log(
        '[Notification diagnostics]',
        stage,
        detail || ''
      );

      renderNotificationDiagnostics();
    }


    function getNotificationDiagnosticHeader() {

      const standalone =
        window.matchMedia &&
        window
          .matchMedia(
            '(display-mode: standalone)'
          )
          .matches;


      const appleStandalone =
        typeof navigator.standalone !==
          'undefined'
          ? navigator.standalone ===
            true
          : false;


      return [
        'Kensington Notifications TEST',
        'Time: ' +
          new Date().toString(),

        'Page: ' +
          location.href,

        'Standalone display-mode: ' +
          (
            standalone
              ? 'yes'
              : 'no'
          ),

        'Apple navigator.standalone: ' +
          (
            appleStandalone
              ? 'yes'
              : 'no'
          ),

        'Notification API: ' +
          (
            'Notification' in window
              ? 'yes'
              : 'no'
          ),

        'Notification permission: ' +
          (
            'Notification' in window
              ? Notification.permission
              : 'unavailable'
          ),

        'Service Worker API: ' +
          (
            'serviceWorker' in navigator
              ? 'yes'
              : 'no'
          ),

        'User agent: ' +
          (
            navigator.userAgent ||
            ''
          ),

        '',
        'EVENTS'
      ].join(
        '\n'
      );
    }


    function getNotificationDiagnosticsText() {

      return (
        getNotificationDiagnosticHeader() +
        '\n' +
        notificationDiagnosticsLog.join(
          '\n'
        )
      );
    }


    function renderNotificationDiagnostics() {

      const output =
        document.getElementById(
          'notificationDiagnosticsOutput'
        );

      if (output) {

        output.textContent =
          getNotificationDiagnosticsText();

        output.scrollTop =
          output.scrollHeight;
      }
    }


    async function copyNotificationDiagnostics() {

      const text =
        getNotificationDiagnosticsText();

      try {

        await navigator.clipboard.writeText(
          text
        );

        addNotificationDiagnostic(
          'DIAGNOSTICS_COPIED',
          'Clipboard write succeeded'
        );

        setNotificationStatus(
          'Diagnostics copied. Paste them into Copilot.'
        );

      } catch (error) {

        addNotificationDiagnostic(
          'DIAGNOSTICS_COPY_FAILED',
          error &&
          error.message
            ? error.message
            : String(error)
        );

        const output =
          document.getElementById(
            'notificationDiagnosticsOutput'
          );

        if (output) {
          output.textContent =
            text;
        }

        setNotificationStatus(
          'Copy was blocked. Open Show diagnostics and manually copy the text.'
        );
      }
    }


    // --------------------------------------------------------
    // DEVICE ID
    // --------------------------------------------------------

    function getPushDeviceId() {

      const key =
        'kensingtonPushDeviceId';

      let id =
        String(
          localStorage.getItem(
            key
          ) || ''
        ).trim();

      if (id) {
        return id;
      }


      id =
        window.crypto &&
        typeof crypto.randomUUID ===
          'function'
          ? crypto.randomUUID()
          : (
              'device-' +
              Date.now() +
              '-' +
              Math.random()
                .toString(36)
                .slice(2)
            );

      localStorage.setItem(
        key,
        id
      );

      return id;
    }


    function createPushBridgeRequestId() {

      return (
        'push-' +
        Date.now() +
        '-' +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }


    // --------------------------------------------------------
    // APPS SCRIPT BRIDGE
    // --------------------------------------------------------

    async function sendPushBridgeRequest(
      type,
      payload
    ) {

      if (!pushBridgeReady) {

        await Promise.race([
          pushBridgeReadyPromise,

          new Promise(
            (resolve, reject) =>
              setTimeout(
                () =>
                  reject(
                    new Error(
                      'The Apps Script registration bridge did not become ready.'
                    )
                  ),
                15000
              )
          )
        ]);
      }


      if (!pushBridgeWindow) {

        throw new Error(
          'The Apps Script registration bridge is unavailable.'
        );
      }


      return new Promise(
        (resolve, reject) => {

          const requestId =
            createPushBridgeRequestId();


          const timeoutId =
            setTimeout(
              () => {

                pushBridgeRequests.delete(
                  requestId
                );

                reject(
                  new Error(
                    'Apps Script did not respond to the registration request.'
                  )
                );
              },
              20000
            );


          pushBridgeRequests.set(
            requestId,
            {
              resolve,
              reject,
              timeoutId
            }
          );


          pushBridgeWindow.postMessage(
            Object.assign(
              {
                type,
                requestId
              },
              payload || {}
            ),
            '*'
          );
        }
      );
    }


    // --------------------------------------------------------
    // MESSAGE BRIDGE
    // --------------------------------------------------------

    window.addEventListener(
      'message',
      event => {

        const message =
          event.data &&
          typeof event.data ===
            'object'
            ? event.data
            : {};


        const type =
          String(
            message.type || ''
          ).trim();


        // ----------------------------------------------------
        // JOB DETAILS BROWSER TAB TITLE
        //
        // The Apps Script Job Details iframe sends the Work
        // Order number to this outer GitHub shell.
        //
        // This outer document owns the actual browser tab.
        // ----------------------------------------------------

        if (
          type ===
          'WORK_ORDER_TITLE'
        ) {

          const title =
            String(
              message.title || ''
            ).trim();

          if (title) {

            document.title =
              title;
          }

          return;
        }


        if (
          type ===
            'PUSH_NOTIFICATION_SETTINGS_OPEN' &&
          pushBridgeWindow &&
          event.source ===
            pushBridgeWindow
        ) {

          openNotificationSettings();

          return;
        }


        if (
          type ===
          'PUSH_REGISTRATION_BRIDGE_READY'
        ) {

          pushBridgeWindow =
            event.source;

          pushBridgeReady =
            true;


          if (
            resolvePushBridgeReady
          ) {

            resolvePushBridgeReady();

            resolvePushBridgeReady =
              null;
          }


          updateNotificationBell(
            currentPushRegistrationStatus
          );

          return;
        }


        if (
          !pushBridgeWindow ||
          event.source !==
            pushBridgeWindow
        ) {

          return;
        }


        if (
          ![
            'PUSH_REGISTRATION_OPTIONS_RESPONSE',
            'PUSH_DEVICE_REGISTRATION_RESPONSE',
            'PUSH_REGISTRATION_STATUS_RESPONSE',
            'PUSH_DEVICE_DISABLE_RESPONSE'
          ].includes(
            type
          )
        ) {

          return;
        }


        const requestId =
          String(
            message.requestId || ''
          ).trim();


        const pending =
          pushBridgeRequests.get(
            requestId
          );


        if (!pending) {
          return;
        }


        clearTimeout(
          pending.timeoutId
        );


        pushBridgeRequests.delete(
          requestId
        );


        if (
          message.error
        ) {

          pending.reject(
            new Error(
              String(
                message.error
              )
            )
          );

          return;
        }


        pending.resolve(
          message.result
        );
      }
    );


    // --------------------------------------------------------
    // REGISTRATION OPTIONS
    // --------------------------------------------------------

    function updatePushRegistrationFields() {

      const type =
        document
          .getElementById(
            'pushDeviceType'
          )
          .value;


      document
        .getElementById(
          'pushEmployeeField'
        )
        .style
        .display =
          type ===
            'PERSONAL'
            ? 'block'
            : 'none';


      document
        .getElementById(
          'pushVehicleField'
        )
        .style
        .display =
          type ===
            'VEHICLE'
            ? 'block'
            : 'none';
    }


    function populatePushRegistrationOptions(
      result
    ) {

      const employees =
        result &&
        Array.isArray(
          result.employees
        )
          ? result.employees
          : [];


      const vehicles =
        result &&
        Array.isArray(
          result.vehicles
        )
          ? result.vehicles
          : [];


      const employeeSelect =
        document.getElementById(
          'pushEmployeeName'
        );


      const vehicleSelect =
        document.getElementById(
          'pushVehicleRegistration'
        );


      employeeSelect.innerHTML =
        '<option value="">Select employee</option>';


      vehicleSelect.innerHTML =
        '<option value="">Select vehicle</option>';


      employees.forEach(
        employee => {

          const name =
            String(
              employee.employeeName ||
              ''
            ).trim();


          if (!name) {
            return;
          }


          const useName =
            String(
              employee.useName ||
              ''
            ).trim();


          const option =
            document.createElement(
              'option'
            );


          option.value =
            name;


          option.textContent =
            useName &&
            useName !==
              name
              ? (
                  useName +
                  ' - ' +
                  name
                )
              : name;


          employeeSelect.appendChild(
            option
          );
        }
      );


      vehicles.forEach(
        vehicle => {

          const registration =
            String(
              vehicle.registration ||
              ''
            ).trim();


          if (!registration) {
            return;
          }


          const extra =
            [
              String(
                vehicle.description ||
                ''
              ).trim(),

              String(
                vehicle.crew ||
                ''
              ).trim()
            ]
              .filter(Boolean)
              .join(
                ' - '
              );


          const option =
            document.createElement(
              'option'
            );


          option.value =
            registration;


          option.textContent =
            extra
              ? (
                  registration +
                  ' - ' +
                  extra
                )
              : registration;


          vehicleSelect.appendChild(
            option
          );
        }
      );
    }


    // --------------------------------------------------------
    // IPHONE-SAFE READ-ONLY OPTIONS THROUGH JSONP
    // --------------------------------------------------------

    async function loadPushRegistrationOptions() {

      setNotificationStatus(
        'Loading employees and vehicles...'
      );


      addNotificationDiagnostic(
        'JSONP_REQUEST_STARTED',
        'Preparing Apps Script registration-options request'
      );


      return new Promise(
        function(
          resolve,
          reject
        ) {

          const callbackName =
            'pushRegistrationOptionsCallback_' +
            Date.now() +
            '_' +
            Math.floor(
              Math.random() *
              1000000
            );


          const script =
            document.createElement(
              'script'
            );


          let timeoutId =
            null;


          let callbackReceived =
            false;


          function cleanup() {

            if (timeoutId) {

              clearTimeout(
                timeoutId
              );
            }


            try {

              delete window[
                callbackName
              ];

            } catch (error) {

              window[
                callbackName
              ] =
                undefined;
            }


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );
            }
          }


          window[
            callbackName
          ] =
            function(result) {

              callbackReceived =
                true;


              addNotificationDiagnostic(
                'JSONP_CALLBACK_RECEIVED',
                'Apps Script called ' +
                callbackName
              );


              if (
                !result ||
                result.success !==
                  true
              ) {

                const message =
                  result &&
                  result.error
                    ? String(
                        result.error
                      )
                    : 'Registration options could not be loaded.';


                addNotificationDiagnostic(
                  'JSONP_RESULT_FAILED',
                  message
                );


                cleanup();


                reject(
                  new Error(
                    message
                  )
                );

                return;
              }


              const employeeCount =
                Array.isArray(
                  result.employees
                )
                  ? result.employees.length
                  : 0;


              const vehicleCount =
                Array.isArray(
                  result.vehicles
                )
                  ? result.vehicles.length
                  : 0;


              addNotificationDiagnostic(
                'JSONP_RESULT_OK',
                'Employees: ' +
                employeeCount +
                '; vehicles: ' +
                vehicleCount
              );


              pushRegistrationOptions =
                result;


              populatePushRegistrationOptions(
                result
              );


              addNotificationDiagnostic(
                'OPTIONS_POPULATED',
                'Employee and vehicle dropdowns updated'
              );


              cleanup();

              resolve(
                result
              );
            };


          script.onload =
            function() {

              addNotificationDiagnostic(
                'JSONP_SCRIPT_LOADED',
                callbackReceived
                  ? 'External script load completed after callback'
                  : 'External script load completed; callback not yet seen'
              );
            };


          script.onerror =
            function() {

              addNotificationDiagnostic(
                'JSONP_SCRIPT_ERROR',
                'The external Apps Script resource failed to load'
              );


              cleanup();


              reject(
                new Error(
                  'Could not load registration options from Apps Script.'
                )
              );
            };


          timeoutId =
            setTimeout(
              function() {

                addNotificationDiagnostic(
                  'JSONP_TIMEOUT',
                  'No Apps Script callback received within 15 seconds'
                );


                cleanup();


                reject(
                  new Error(
                    'Timed out loading employees and vehicles.'
                  )
                );
              },
              15000
            );


          script.src =
            APPS_SCRIPT_URL +
            '?api=pushRegistrationOptions' +
            '&callback=' +
            encodeURIComponent(
              callbackName
            ) +
            '&_=' +
            Date.now();


          addNotificationDiagnostic(
            'JSONP_SCRIPT_URL_CREATED',
            script.src
          );


          script.async =
            true;


          document.head.appendChild(
            script
          );


          addNotificationDiagnostic(
            'JSONP_SCRIPT_INSERTED',
            'Script element appended to document.head'
          );
        }
      );
    }


    // --------------------------------------------------------
    // APPS SCRIPT URL
    // --------------------------------------------------------

    function buildAppsScriptUrl() {

      const outer =
        new URL(
          location.href
        );


      const inner =
        new URL(
          APPS_SCRIPT_URL
        );


      outer.searchParams.forEach(
        (
          value,
          key
        ) =>
          inner.searchParams.set(
            key,
            value
          )
      );


      inner.searchParams.set(
        'shell',
        outer.origin +
        outer.pathname
      );


      return inner.toString();
    }


    // --------------------------------------------------------
    // LOAD WORK ORDERS APP
    //
    // The GitHub shell owns the actual browser tab title.
    //
    // If ?job= exists, set the title immediately to the Work
    // Order number. Otherwise use Work Orders.
    // --------------------------------------------------------

    function loadWorkOrdersApp() {

      const outerUrl =
        new URL(
          location.href
        );


      const job =
        String(
          outerUrl.searchParams.get(
            'job'
          ) || ''
        ).trim();


      document.title =
        job ||
        'Work Orders';


      document
        .getElementById(
          'appFrame'
        )
        .src =
          buildAppsScriptUrl();
    }


    // --------------------------------------------------------
    // NOTIFICATION UI
    // --------------------------------------------------------

    function setNotificationStatus(
      message
    ) {

      document
        .getElementById(
          'notificationStatus'
        )
        .textContent =
          message || '';
    }


    function showNotificationSetup() {

      document
        .getElementById(
          'notificationBackdrop'
        )
        .style
        .display =
          'block';


      document
        .getElementById(
          'notificationSetup'
        )
        .style
        .display =
          'block';
    }


    function hideNotificationSetup() {

      document
        .getElementById(
          'notificationSetup'
        )
        .style
        .display =
          'none';


      document
        .getElementById(
          'notificationBackdrop'
        )
        .style
        .display =
          'none';
    }


    function updateNotificationBell(
      status
    ) {

      if (!pushBridgeWindow) {
        return;
      }


      let state =
        'ATTENTION';


      let identity =
        '';


      if (
        !(
          'Notification' in window
        ) ||
        Notification.permission ===
          'denied'
      ) {

        state =
          'BLOCKED';

      } else if (
        status &&
        status.registered ===
          true &&
        status.enabled ===
          true &&
        Notification.permission ===
          'granted'
      ) {

        state =
          'ENABLED';


        identity =
          String(
            status.registeredIdentity ||
            ''
          );
      }


      pushBridgeWindow.postMessage(
        {
          type:
            'PUSH_NOTIFICATION_STATUS_UPDATE',

          state:
            state,

          identity:
            identity
        },
        '*'
      );
    }


    function displayPushRegistrationStatus(
      status
    ) {

      currentPushRegistrationStatus =
        status ||
        null;


      const disableButton =
        document.getElementById(
          'disableNotificationsButton'
        );


      const registerButton =
        document.getElementById(
          'enableNotificationsButton'
        );


      updateNotificationBell(
        status
      );


      if (
        Notification.permission ===
        'denied'
      ) {

        disableButton.style.display =
          status &&
          status.registered &&
          status.enabled
            ? 'block'
            : 'none';


        registerButton.style.display =
          'none';


        setNotificationStatus(
          'Notifications are blocked in this browser. Use the browser site permissions to allow notifications, then reopen this panel.'
        );


        if (
          !notificationSetupOpenedManually
        ) {

          hideNotificationSetup();
        }

        return;
      }


      registerButton.style.display =
        'block';


      if (
        status &&
        status.registered &&
        status.enabled
      ) {

        disableButton.style.display =
          'block';


        registerButton.textContent =
          'Update Device Registration';


        setNotificationStatus(
          'Notifications are enabled.\n\n' +
          'Registered as: ' +
          String(
            status.registeredIdentity ||
            ''
          ) +
          '\nType: ' +
          String(
            status.deviceType ||
            ''
          ) +
          '\nBrowser permission: ' +
          String(
            Notification.permission ||
            ''
          )
        );

      } else {

        disableButton.style.display =
          'none';


        registerButton.textContent =
          'Enable Notifications & Register Device';


        if (
          status &&
          status.registered &&
          status.enabled ===
            false
        ) {

          setNotificationStatus(
            'Notifications are disabled for this browser. Select the person or vehicle and register again to enable them.'
          );

        } else if (
          Notification.permission ===
          'granted'
        ) {

          setNotificationStatus(
            'Notification permission is already allowed. Select the person or vehicle to register this browser.'
          );

        } else {

          setNotificationStatus(
            'Register this browser to receive Work Order notifications.'
          );
        }
      }


      if (
        !notificationSetupOpenedManually
      ) {

        hideNotificationSetup();
      }
    }


    async function loadPushRegistrationStatus() {

      const result =
        await sendPushBridgeRequest(
          'PUSH_REGISTRATION_STATUS_REQUEST',
          {
            deviceId:
              getPushDeviceId()
          }
        );


      if (
        !result ||
        result.success !==
          true
      ) {

        throw new Error(
          'Registration status could not be loaded.'
        );
      }


      displayPushRegistrationStatus(
        result
      );


      return result;
    }


    function openNotificationSettings() {

      notificationSetupOpenedManually =
        true;


      showNotificationSetup();


      displayPushRegistrationStatus(
        currentPushRegistrationStatus
      );
    }


    function closeNotificationSettings() {

      notificationSetupOpenedManually =
        false;


      hideNotificationSetup();
    }


    async function disableNotificationsForThisBrowser() {

      const button =
        document.getElementById(
          'disableNotificationsButton'
        );


      button.disabled =
        true;


      setNotificationStatus(
        'Disabling notifications for this browser...'
      );


      try {

        const result =
          await sendPushBridgeRequest(
            'PUSH_DEVICE_DISABLE_REQUEST',
            {
              deviceId:
                getPushDeviceId()
            }
          );


        if (
          !result ||
          result.success !==
            true ||
          result.disabled !==
            true
        ) {

          throw new Error(
            'Apps Script did not confirm that the registration was disabled.'
          );
        }


        currentPushRegistrationStatus = {
          success:
            true,

          registered:
            true,

          enabled:
            false,

          reason:
            'DISABLED'
        };


        notificationSetupOpenedManually =
          false;


        updateNotificationBell(
          currentPushRegistrationStatus
        );


        hideNotificationSetup();

      } catch (error) {

        setNotificationStatus(
          'Notifications could not be disabled: ' +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );

      } finally {

        button.disabled =
          false;
      }
    }


    // --------------------------------------------------------
    // SERVICE WORKER / FIREBASE
    // --------------------------------------------------------

    async function registerServiceWorker() {

      if (
        !(
          'serviceWorker' in navigator
        )
      ) {

        return null;
      }


      try {

        const registration =
          await navigator
            .serviceWorker
            .register(
              './service-worker.js'
            );


        serviceWorkerRegistration =
          registration;


        return registration;

      } catch (error) {

        console.error(
          '[PWA] Service worker registration failed:',
          error
        );


        return null;
      }
    }


    function initialiseFirebase() {

      if (
        !firebase.apps.length
      ) {

        firebase.initializeApp(
          FIREBASE_CONFIG
        );
      }


      firebaseMessaging =
        firebase.messaging();
    }


    // --------------------------------------------------------
    // ENABLE / REGISTER NOTIFICATIONS
    // --------------------------------------------------------

    async function enableNotifications() {

      const button =
        document.getElementById(
          'enableNotificationsButton'
        );


      const deviceType =
        document
          .getElementById(
            'pushDeviceType'
          )
          .value;


      const employeeName =
        document
          .getElementById(
            'pushEmployeeName'
          )
          .value;


      const vehicleRegistration =
        document
          .getElementById(
            'pushVehicleRegistration'
          )
          .value;


      if (
        deviceType ===
          'PERSONAL' &&
        !employeeName
      ) {

        setNotificationStatus(
          'Select an employee before registering this device.'
        );

        return;
      }


      if (
        deviceType ===
          'VEHICLE' &&
        !vehicleRegistration
      ) {

        setNotificationStatus(
          'Select a vehicle before registering this device.'
        );

        return;
      }


      button.disabled =
        true;


      setNotificationStatus(
        'Requesting notification permission...'
      );


      try {

        const permission =
          await Notification
            .requestPermission();


        if (
          permission !==
          'granted'
        ) {

          setNotificationStatus(
            'Notifications were not enabled. Browser permission: ' +
            permission
          );


          button.disabled =
            false;


          updateNotificationBell(
            currentPushRegistrationStatus
          );

          return;
        }


        if (
          !serviceWorkerRegistration
        ) {

          serviceWorkerRegistration =
            await registerServiceWorker();
        }


        if (
          !serviceWorkerRegistration
        ) {

          throw new Error(
            'Service worker registration is unavailable.'
          );
        }


        initialiseFirebase();


        setNotificationStatus(
          'Creating the Firebase registration token...'
        );


        const token =
          await firebaseMessaging
            .getToken({
              vapidKey:
                VAPID_KEY,

              serviceWorkerRegistration:
                serviceWorkerRegistration
            });


        if (!token) {

          throw new Error(
            'Firebase did not return a registration token.'
          );
        }


        setNotificationStatus(
          'Saving this device registration...'
        );


        const result =
          await sendPushBridgeRequest(
            'PUSH_DEVICE_REGISTRATION_REQUEST',
            {
              registration: {
                deviceId:
                  getPushDeviceId(),

                pushToken:
                  token,

                deviceType:
                  deviceType,

                employeeName:
                  deviceType ===
                    'PERSONAL'
                    ? employeeName
                    : '',

                vehicleRegistration:
                  deviceType ===
                    'VEHICLE'
                    ? vehicleRegistration
                    : '',

                userAgent:
                  navigator.userAgent ||
                  '',

                platform:
                  navigator.userAgentData &&
                  navigator.userAgentData
                    .platform
                    ? navigator
                        .userAgentData
                        .platform
                    : (
                        navigator.platform ||
                        ''
                      ),

                notificationPermission:
                  Notification.permission
              }
            }
          );


        if (
          !result ||
          result.success !==
            true
        ) {

          throw new Error(
            'Apps Script did not confirm the registration.'
          );
        }


        const identity =
          result.deviceType ===
            'PERSONAL'
            ? result.employeeName
            : result.vehicleRegistration;


        currentPushRegistrationStatus = {
          success:
            true,

          registered:
            true,

          enabled:
            true,

          deviceType:
            result.deviceType,

          employeeName:
            result.employeeName ||
            '',

          vehicleRegistration:
            result.vehicleRegistration ||
            '',

          registeredIdentity:
            identity,

          notificationPermission:
            Notification.permission,

          rowNumber:
            result.rowNumber,

          reason:
            'REGISTERED'
        };


        notificationSetupOpenedManually =
          false;


        updateNotificationBell(
          currentPushRegistrationStatus
        );


        button.textContent =
          'Update Device Registration';


        button.disabled =
          false;


        document
          .getElementById(
            'disableNotificationsButton'
          )
          .style
          .display =
            'block';


        hideNotificationSetup();

      } catch (error) {

        console.error(
          '[FCM] Device registration failed:',
          error
        );


        setNotificationStatus(
          'Device registration failed: ' +
          (
            error &&
            error.message
              ? error.message
              : String(error)
          )
        );


        button.disabled =
          false;


        updateNotificationBell(
          currentPushRegistrationStatus
        );
      }
    }


    // --------------------------------------------------------
    // NOTIFICATION STARTUP
    // --------------------------------------------------------

    async function prepareNotifications() {

      addNotificationDiagnostic(
        'PREPARE_NOTIFICATIONS_STARTED',
        'Notification startup entered'
      );


      hideNotificationSetup();


      updateNotificationBell(
        null
      );


      if (
        !(
          'Notification' in window
        )
      ) {

        addNotificationDiagnostic(
          'NOTIFICATION_API_UNAVAILABLE',
          'window.Notification is missing'
        );


        setNotificationStatus(
          'This browser does not support notifications.'
        );


        document
          .getElementById(
            'enableNotificationsButton'
          )
          .disabled =
            true;

        return;
      }


      addNotificationDiagnostic(
        'NOTIFICATION_API_AVAILABLE',
        'Permission: ' +
        Notification.permission
      );


      if (
        !(
          'serviceWorker' in navigator
        )
      ) {

        addNotificationDiagnostic(
          'SERVICE_WORKER_API_UNAVAILABLE',
          'navigator.serviceWorker is missing'
        );


        setNotificationStatus(
          'This browser does not support service workers.'
        );


        document
          .getElementById(
            'enableNotificationsButton'
          )
          .disabled =
            true;

        return;
      }


      addNotificationDiagnostic(
        'SERVICE_WORKER_API_AVAILABLE',
        'Registering service worker'
      );


      const registration =
        await registerServiceWorker();


      addNotificationDiagnostic(
        registration
          ? 'SERVICE_WORKER_REGISTERED'
          : 'SERVICE_WORKER_REGISTRATION_FAILED',

        registration &&
        registration.scope
          ? registration.scope
          : ''
      );


      try {

        await loadPushRegistrationOptions();


        addNotificationDiagnostic(
          'OPTIONS_LOAD_COMPLETE',
          'Beginning registration-status lookup'
        );


        await loadPushRegistrationStatus();


        addNotificationDiagnostic(
          'REGISTRATION_STATUS_LOADED',
          'Notification startup completed'
        );

      } catch (error) {

        const message =
          error &&
          error.message
            ? error.message
            : String(error);


        addNotificationDiagnostic(
          'PREPARE_NOTIFICATIONS_FAILED',
          message
        );


        showNotificationSetup();


        updateNotificationBell(
          null
        );


        setNotificationStatus(
          'Notification setup could not be loaded: ' +
          message
        );
      }
    }


    // --------------------------------------------------------
    // EVENT HANDLERS
    // --------------------------------------------------------

    document
      .getElementById(
        'pushDeviceType'
      )
      .addEventListener(
        'change',
        updatePushRegistrationFields
      );


    document
      .getElementById(
        'enableNotificationsButton'
      )
      .addEventListener(
        'click',
        enableNotifications
      );


    document
      .getElementById(
        'disableNotificationsButton'
      )
      .addEventListener(
        'click',
        disableNotificationsForThisBrowser
      );


    document
      .getElementById(
        'notificationBackdrop'
      )
      .addEventListener(
        'click',
        closeNotificationSettings
      );


    document
      .getElementById(
        'copyNotificationDiagnosticsButton'
      )
      .addEventListener(
        'click',
        copyNotificationDiagnostics
      );


    updatePushRegistrationFields();


    document.addEventListener(
      'DOMContentLoaded',
      function() {

        addNotificationDiagnostic(
          'PAGE_READY',
          'DOMContentLoaded fired'
        );


        renderNotificationDiagnostics();


        loadWorkOrdersApp();


        prepareNotifications();
      }
    );

  </script>

</body>
</html>
