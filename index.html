<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Work Orders</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    title="Work Orders"
    allow="geolocation"
  ></iframe>

  <script>
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyOf3y0SYvG7xkW3qCf1ogJGr_p7JBw-cB0UIoYiLT9kyMIqiHQHWuJnvmIhXEt_LfHnQ/exec';

    function buildAppsScriptUrl() {
      const outerUrl =
        new URL(
          window.location.href
        );

      const innerUrl =
        new URL(
          APPS_SCRIPT_URL
        );

      outerUrl.searchParams.forEach(
        function(
          value,
          key
        ) {
          innerUrl.searchParams.set(
            key,
            value
          );
        }
      );

      return innerUrl.toString();
    }

    function buildGitHubUrl(
      parameters
    ) {
      const url =
        new URL(
          window.location.href
        );

      url.search =
        '';

      url.hash =
        '';

      Object.keys(
        parameters || {}
      ).forEach(
        function(key) {
          const value =
            parameters[key];

          if (
            value !== null &&
            value !== undefined &&
            value !== ''
          ) {
            url.searchParams.set(
              key,
              String(
                value
              )
            );
          }
        }
      );

      return url.toString();
    }

    function loadWorkOrdersApp() {
      const frame =
        document.getElementById(
          'appFrame'
        );

      frame.src =
        buildAppsScriptUrl();
    }

    window.addEventListener(
      'message',
      function(event) {
        const frame =
          document.getElementById(
            'appFrame'
          );

        if (
          !frame ||
          event.source !== frame.contentWindow
        ) {
          return;
        }

        const message =
          event.data;

        if (!message) {
          return;
        }

        if (
          message.type ===
            'WORK_ORDERS_OPEN_HOME'
        ) {
          window.location.href =
            buildGitHubUrl({});

          return;
        }

        if (
          message.type !==
            'WORK_ORDERS_OPEN_JOB'
        ) {
          return;
        }

        const workOrderNumber =
          String(
            message.workOrderNumber || ''
          ).trim();

        if (!workOrderNumber) {
          return;
        }

        const detailUrl =
          buildGitHubUrl({
            job:
              workOrderNumber
          });

        window.open(
          detailUrl,
          '_blank',
          'noopener'
        );
      }
    );

    document.addEventListener(
      'DOMContentLoaded',
      loadWorkOrdersApp
    );
  </script>

</body>
</html>
