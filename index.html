<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Work Orders</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    title="Work Orders"
    allow="geolocation"
  ></iframe>

  <script>
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyOf3y0SYvG7xkW3qCf1ogJGr_p7JBw-cB0UIoYiLT9kyMIqiHQHWuJnvmIhXEt_LfHnQ/exec';


    function loadWorkOrdersApp() {
      const frame =
        document.getElementById(
          'appFrame'
        );

      frame.src =
        APPS_SCRIPT_URL;
    }


    document.addEventListener(
      'DOMContentLoaded',
      loadWorkOrdersApp
    );
  </script>

</body>
</html>
