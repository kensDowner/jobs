<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Work Orders</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    title="Work Orders"
    allow="geolocation"
  ></iframe>

  <script>
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbyOf3y0SYvG7xkW3qCf1ogJGr_p7JBw-cB0UIoYiLT9kyMIqiHQHWuJnvmIhXEt_LfHnQ/exec';

    const GITHUB_SHELL_CHANNEL =
      'KENSDOWNER_JOBS_V1';

    function buildAppsScriptUrl() {
      const outerUrl =
        new URL(
          window.location.href
        );

      const innerUrl =
        new URL(
          APPS_SCRIPT_URL
        );

      outerUrl.searchParams.forEach(
        function(value, key) {
          innerUrl.searchParams.set(
            key,
            value
          );
        }
      );

      return innerUrl.toString();
    }

    function buildGitHubUrl(
      parameters
    ) {
      const url =
        new URL(
          window.location.href
        );

      url.search =
        '';

      url.hash =
        '';

      Object.keys(
        parameters || {}
      ).forEach(
        function(key) {
          const value =
            parameters[key];

          if (
            value !== null &&
            value !== undefined &&
            value !== ''
          ) {
            url.searchParams.set(
              key,
              String(
                value
              )
            );
          }
        }
      );

      return url.toString();
    }

    function loadWorkOrdersApp() {
      document
        .getElementById(
          'appFrame'
        )
        .src =
          buildAppsScriptUrl();
    }

    window.addEventListener(
      'message',
      function(event) {
        const message =
          event.data;

        if (
          !message ||
          message.channel !==
            GITHUB_SHELL_CHANNEL
        ) {
          return;
        }

        if (
          message.type ===
            'WORK_ORDERS_SHELL_HELLO'
        ) {
          if (event.source) {
            event.source.postMessage(
              {
                channel:
                  GITHUB_SHELL_CHANNEL,

                type:
                  'WORK_ORDERS_SHELL_ACK'
              },
              '*'
            );
          }
          return;
        }

        if (
          message.type ===
            'WORK_ORDERS_OPEN_HOME'
        ) {
          window.location.href =
            buildGitHubUrl({});
          return;
        }

        if (
          message.type !==
            'WORK_ORDERS_OPEN_JOB'
        ) {
          return;
        }

        const workOrderNumber =
          String(
            message.workOrderNumber || ''
          ).trim();

        if (!workOrderNumber) {
          return;
        }

        window.open(
          buildGitHubUrl({
            job:
              workOrderNumber
          }),
          '_blank',
          'noopener'
        );
      }
    );

    document.addEventListener(
      'DOMContentLoaded',
      loadWorkOrdersApp
    );
  </script>
</body>
</html>
