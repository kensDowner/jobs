<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#1565c0">

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Work Orders</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    title="Work Orders"
    allow="geolocation"
  ></iframe>

  <script>
    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbzMzdMhAa7d1Da5A6BF7EFmqCXPC75SBQO1tDg9OUjivDwTDF050wwP4qP6hhHU53ivTw/exec';

    function buildAppsScriptUrl() {
      const outerUrl =
        new URL(
          window.location.href
        );

      const innerUrl =
        new URL(
          APPS_SCRIPT_URL
        );

      outerUrl.searchParams.forEach(
        function(value, key) {
          innerUrl.searchParams.set(
            key,
            value
          );
        }
      );

      innerUrl.searchParams.set(
        'shell',
        outerUrl.origin +
        outerUrl.pathname
      );

      return innerUrl.toString();
    }

    function loadWorkOrdersApp() {
      document
        .getElementById(
          'appFrame'
        )
        .src =
          buildAppsScriptUrl();
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        console.log(
          '[PWA] Service workers are not supported by this browser.'
        );
        return;
      }

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )
        .then(function(registration) {
          console.log(
            '[PWA] Service worker registered:',
            registration.scope
          );
        })
        .catch(function(error) {
          console.error(
            '[PWA] Service worker registration failed:',
            error
          );
        });
    }

    document.addEventListener(
      'DOMContentLoaded',
      function() {
        loadWorkOrdersApp();
        registerServiceWorker();
      }
    );
  </script>

</body>
</html>
